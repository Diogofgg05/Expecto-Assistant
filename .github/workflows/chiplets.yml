name: Expecto chiplets and regressions
on:
  pull_request:
  push:
    branches: [main]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline-test dependencies
        run: >-
          python -m pip install
          'fastapi>=0.115,<1.0' 'httpx>=0.27,<1.0'
          'pydantic>=2.7,<3.0' 'cryptography>=43,<47'
          'PyMuPDF>=1.24,<2' 'pytest>=8,<10'
      - name: Chiplet and existing engine/API regressions
        run: python -m pytest -q tests/test_chiplets_v60.py tests/test_engine.py tests/test_api.py
      - name: Full offline regression suite
        run: python -m pytest -q tests
      - name: Isolated cold-start proxy (not prior-commit A/B)
        run: python scripts/benchmark_chiplets.py --runs 3
