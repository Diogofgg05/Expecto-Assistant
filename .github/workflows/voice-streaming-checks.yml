name: EXPECTO quality gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install unencrypted-test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' 'httpx>=0.27,<1' 'pydantic>=2.7,<3' 'cryptography>=43,<47' 'pytest>=8,<10' 'numpy>=1.26,<3' 'pymupdf>=1.24,<2'
      - name: Python syntax
        run: python -m compileall -q aura tests scripts
      - name: Architectural dependency contracts
        run: python -m scripts.check_architecture --check
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/orb.js
          node --check web/voice.js
          node --check web/local-voice.js
          node --check web/audio-pipeline.js
          node --check web/capture-worklet.js
      - name: All Python regression tests
        run: python -m pytest -q tests
      - name: Semantic memory synthetic benchmark
        run: python -m scripts.benchmark_semantic_memory --rows 500 --dims 32 --runs 2
      - name: Browser speech regression
        run: node --test tests/test_voice_browser_v54.cjs tests/test_voice_prefetch_v56.cjs tests/test_audio_pipeline_v62.cjs
