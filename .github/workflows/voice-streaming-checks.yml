name: Voice and streaming regression
on:
  pull_request:
    paths:
      - 'aura/app.py'
      - 'aura/config.py'
      - 'scripts/benchmark_ollama_streaming.py'
      - '.env.example'
      - 'aura/engine.py'
      - 'aura/engine_services.py'
      - 'aura/command_reflection.py'
      - 'aura/command_research.py'
      - 'aura/api_contracts.py'
      - 'tests/test_api_contracts_v71.py'
      - 'aura/llm.py'
      - 'aura/nanomemory.py'
      - 'tests/test_nanomemory_v70.py'
      - 'aura/memory.py'
      - 'aura/context_selection.py'
      - 'tests/test_context_selection_v66.py'
      - 'scripts/benchmark_adaptive_models.py'
      - 'tests/test_adaptive_inference_v65.py'
      - 'VERSION'
      - 'tests/test_ollama_pool_release_v64.py'
      - 'aura/performance.py'
      - 'aura/persistent_whisper.py'
      - 'tests/test_whisper_continuous_v61.py'
      - 'tests/test_audio_pipeline_v62.cjs'
      - 'tests/test_performance_engine_v60.py'
      - 'web/**'
      - 'tests/test_voice_streaming_v53.py'
      - 'tests/test_voice_browser_v54.cjs'
      - 'tests/test_voice_prefetch_v56.cjs'
      - 'tests/test_local_voice_v55.py'
      - 'tests/test_piper_persistent_v57.py'
      - 'aura/local_voice.py'
      - '.github/workflows/voice-streaming-checks.yml'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install unencrypted-test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' 'httpx>=0.27,<1' 'pydantic>=2.7,<3' 'cryptography>=43,<47' 'pytest>=8,<10' 'numpy>=1.26,<3' 'pymupdf>=1.24,<2'
      - name: Python syntax
        run: python -m compileall -q aura tests scripts
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/orb.js
          node --check web/voice.js
          node --check web/local-voice.js
          node --check web/audio-pipeline.js
          node --check web/capture-worklet.js
      - name: All Python regression tests
        run: python -m pytest -q tests
      - name: Browser speech regression
        run: node --test tests/test_voice_browser_v54.cjs tests/test_voice_prefetch_v56.cjs tests/test_audio_pipeline_v62.cjs
