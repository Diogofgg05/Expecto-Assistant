name: Voice and streaming regression
on:
  pull_request:
    paths:
      - 'aura/app.py'
      - 'aura/config.py'
      - 'scripts/benchmark_ollama_streaming.py'
      - '.env.example'
      - 'aura/engine.py'
      - 'aura/llm.py'
      - 'web/**'
      - 'tests/test_voice_streaming_v53.py'
      - 'tests/test_voice_browser_v54.cjs'
      - 'tests/test_voice_prefetch_v56.cjs'
      - 'tests/test_local_voice_v55.py'
      - '.github/workflows/voice-streaming-checks.yml'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install unencrypted-test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' 'httpx>=0.27,<1' 'pydantic>=2.7,<3' 'cryptography>=43,<47' 'pytest>=8,<10'
      - name: Python syntax
        run: python -m compileall -q aura tests scripts
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/voice.js
          node --check web/local-voice.js
      - name: Streaming API regression
        run: python -m pytest -q tests/test_voice_streaming_v53.py tests/test_local_voice_v55.py tests/test_api.py tests/test_engine.py
      - name: Browser speech regression
        run: node --test tests/test_voice_browser_v54.cjs tests/test_voice_prefetch_v56.cjs
