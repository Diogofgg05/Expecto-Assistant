<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030910">
  <meta name="description" content="Expecto Ultimate — interface conversacional holográfica local-first">
  <title>EXPECTO · PATRONUM</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/orb.js" defer></script>
  <script src="/static/math.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main id="app" class="app idle">
    <div class="starfield" aria-hidden="true"></div>
    <div class="ambient-lines" aria-hidden="true"></div>
    <div id="workspace" class="workspace" style="--aura-width:43%">
      <section id="aura-stage" class="aura-stage" aria-label="Presença holográfica da Expecto">
        <div class="halo" aria-hidden="true"></div>
        <canvas id="aura-canvas" aria-hidden="true"></canvas>
        <div class="aura-identity" aria-hidden="true">
          <span class="wordmark">EXPECTO</span>
          <span class="descriptor">A U T O N O M O U S &nbsp; I N T E L L I G E N C E</span>
        </div>
        <div class="aura-presence" id="aura-presence" aria-live="polite">SISTEMA DISPONÍVEL</div>
      </section>
      <section id="panels" class="panels" aria-label="Espaços criados por comando" hidden></section>
    </div>
    <div class="hud-top" aria-hidden="true"><span class="hud-mark">E / P</span><span id="clock"></span></div>
    <div id="live-transcript" class="live-transcript" aria-live="polite"></div>
    <div id="command-shell" class="command-shell" hidden>
      <label for="command-input" class="sr-only">Escreve um comando para a Expecto</label>
      <span class="prompt-symbol" aria-hidden="true">›</span>
      <input id="command-input" type="text" maxlength="2000" autocomplete="off" spellcheck="false"
        placeholder="Fala com a Expecto..." aria-label="Comando para a Expecto">
      <span class="enter-hint" aria-hidden="true">ENTER</span>
    </div>
    <div id="hint" class="hint" aria-hidden="true">V · VOZ &nbsp;&nbsp; / · ESCREVER &nbsp;&nbsp; ESC · LIMPAR</div>
  </main>
</body>
</html>
